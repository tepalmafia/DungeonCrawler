<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스페이스워</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%2303040a'/><circle cx='8' cy='8' r='3' fill='none' stroke='%236fd8a0' stroke-width='1.4'/></svg>">
<link rel="stylesheet" href="css/style.css?v=36">
<script type="importmap">
{ "imports": {
  "three": "./vendor/three/three.module.min.js",
  "three/addons/": "./vendor/three/addons/"
} }
</script>
</head>
<body>

<canvas id="view"></canvas>

<!-- 조준점. UI 는 이것 하나뿐이다 — 체력바도 상태창도 안 만든다
     (docs/space/PLAN.md §5-2 손이 곧 상태창) -->
<div id="cross"></div>

<!-- 잠깐 뜨는 글자. 「접촉」·「뿌리쳤습니다」 같은 **일어난 일**만 알린다.
     상태(열·자국·거리)는 콘솔 화면이 맡는다 — UI 를 늘리지 않는다 -->
<div id="hud" hidden></div>

<!-- 가르침 한 줄. 배너와 **다른 자리·다른 색**이다 —
     배너(위·주황)는 *일어난 일*, 가르침(아래·청록)은 *아직 안 한 일*.
     시간으로 안 사라지고 **하면** 사라진다 (docs/space/TUTORIAL.md §3-A) -->
<div id="lesson" hidden></div>

<!-- ★ 여기가 **여덟 문단**이었다.
     기능이 늘 때마다 한 줄씩 붙여서 설명서가 됐고, 시작 화면의 설명서는
     읽히지 않는다. 그러면서 「알려 줬다」는 알리바이가 되어 진짜 문제를
     가렸다. 일곱 가지는 이제 게임 안에서 **하나씩 만나는 순간에** 나온다
     (docs/space/TUTORIAL.md). 여기 다시 문단을 붙이고 싶어지면
     그건 가르침이 제 일을 못 하고 있다는 뜻이지 안내가 모자란 게 아니다. -->
<div id="hint">
  <b>스페이스워</b> — 따라오지 못하는 곳까지
  <p>화면을 눌러 시작합니다. 소리가 납니다 — <b>M</b> 으로 끕니다.</p>
  <!-- ★ 여기 한 줄을 더 붙인 이유. 손목은 **왼쪽 아래에 늘 켜져 있어서**
       설명 없이도 눈에 들어오지만, 「들어 올릴 수 있다」는 아무 데도 안
       적혀 있으면 영영 모른다. 가르침 일곱에 여덟째를 보태는 대신
       (한 번에 하나 · TUTORIAL.md) 여기 한 줄로 끝낸다 -->
  <p class="key">왼쪽 아래 손목 장치가 <b>지금 할 일</b>을 말합니다 —
     <b>Q</b> 를 잡으면 눈앞으로 옵니다.</p>
</div>

<script type="module" src="js/main.js?v=36"></script>
</body>
</html>
