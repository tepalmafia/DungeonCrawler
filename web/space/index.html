<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- ★ **이 파일만은 캐시하지 않습니다.** `?v=` 는 css·js 를 갈아 주지만
     그 번호가 적혀 있는 곳이 여기입니다 — 이 파일이 캐시되면 브라우저는
     영영 옛 번호를 읽고, **고쳐도 안 바뀝니다.** 캐시버스트를 스무 번
     올리는 동안 이 구멍이 열려 있었습니다. -->
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<title>스페이스워</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%2303040a'/><circle cx='8' cy='8' r='3' fill='none' stroke='%236fd8a0' stroke-width='1.4'/></svg>">
<link rel="stylesheet" href="css/style.css?v=78">
<script type="importmap">
{ "imports": {
  "three": "./vendor/three/three.module.min.js",
  "three/addons/": "./vendor/three/addons/"
} }
</script>
</head>
<body>

<canvas id="view"></canvas>

<!-- 조준점. UI 는 이것 하나뿐이다 — 체력바도 상태창도 안 만든다
     (docs/space/PLAN.md §5-2 손이 곧 상태창) -->
<div id="cross"></div>

<!-- 잠깐 뜨는 글자. 「접촉」·「뿌리쳤습니다」 같은 **일어난 일**만 알린다.
     상태(열·자국·거리)는 콘솔 화면이 맡는다 — UI 를 늘리지 않는다 -->
<div id="hud" hidden></div>

<!-- 가르침 한 줄. 배너와 **다른 자리·다른 색**이다 —
     배너(위·주황)는 *일어난 일*, 가르침(아래·청록)은 *아직 안 한 일*.
     시간으로 안 사라지고 **하면** 사라진다 (docs/space/TUTORIAL.md §3-A) -->
<div id="lesson" hidden></div>

<!-- ★ 여기가 **여덟 문단**이었다.
     기능이 늘 때마다 한 줄씩 붙여서 설명서가 됐고, 시작 화면의 설명서는
     읽히지 않는다. 그러면서 「알려 줬다」는 알리바이가 되어 진짜 문제를
     가렸다. 일곱 가지는 이제 게임 안에서 **하나씩 만나는 순간에** 나온다
     (docs/space/TUTORIAL.md). 여기 다시 문단을 붙이고 싶어지면
     그건 가르침이 제 일을 못 하고 있다는 뜻이지 안내가 모자란 게 아니다. -->
<!-- ══════════════════════════════════════════════════════════════════
     ★★★ **제목 화면** — 보통 게임처럼 (v78)

     사장님 「게임 시작 시 팝업창이 불편한데 … **자꾸 실수로 뜨잔아**」
            「**일반적인 게임 시작 화면으로** 바꿔」

     ★ 여태 이 화면이 **잠금이 풀릴 때마다** 되살아났다 (Esc·알트탭·
       창 밖 클릭). 제목 화면과 멈춤 화면을 한 물건이 겸하고 있었기
       때문이다. 이제 **시작 전에 딱 한 번**만 뜨고, 노는 중에 잠금이
       풀리면 뜨는 것은 **멈춤 화면**이다.

     ★ 그리고 보통 게임이 갖는 것을 갖춘다 — **제목 · 시작 단추 ·
       조작법.** 여태 「화면을 눌러 시작합니다」 한 줄이었고, 그러면
       처음 온 사람은 무엇을 하는 게임인지도 모르고 클릭부터 한다
     ══════════════════════════════════════════════════════════════════ -->
<div id="hint">
  <div class="title" data-ui>
    <h1>스페이스워</h1>
    <p class="tag">적진을 뚫고 들어간다 &middot; 탄두를 채워 가며 &middot; 적 행성에 떨군다</p>

    <div class="menu">
      <button id="btn-play" type="button" class="big">시작</button>
      <button id="btn-new" type="button">처음부터 다시</button>
      <button id="btn-check" type="button">점검 모드</button>
    </div>

    <!-- ★ 조작법은 **접어 둔다.** 펴 두면 제목 화면이 설명서가 되고,
         이 게임은 첫 회차가 곧 튜토리얼이다 (TUTORIAL.md). 그래도
         「어디에 적혀 있나」는 있어야 한다 -->
    <details class="keys">
      <summary>조작법</summary>
      <div class="grid">
        <span>움직이기</span><b>W A S D</b>
        <span>달리기</span><b>Shift</b>
        <span>손 쓰기</span><b>마우스 왼쪽 — 잡고 · 누르고 · 돌린다</b>
        <span>손목 장치</span><b>Q — 지금 할 일을 말한다</b>
        <span>조종석에서</span><b>조종간을 잡으면 창이 열린다</b>
        <span>급기동 · 급가속</span><b>Shift &middot; R</b>
        <span>멈추기</span><b>Esc</b>
        <span>소리 끄기</span><b>M</b>
        <span>점검 모드</span><b>F2 또는 `</b>
      </div>
    </details>

    <!-- ★ 판본을 띄웁니다 (2026-08-06). 「고쳤다는데 그대로다」가 세 번
         났는데, 그때 **화면에 무엇이 떠 있는지 알 길이 없었습니다** —
         브라우저가 옛 파일을 들고 있는 것과 코드가 틀린 것을 구별 못 합니다 -->
    <p class="ver">소리가 납니다 &middot; <span id="ver"></span></p>
  </div>
</div>

<!-- ★ 멈춤 화면 (Esc). **2시간짜리인데 멈출 수가 없으면 사람은 브라우저를
     닫습니다** — 그리고 그때까지 저장이 아예 없었으므로 그 회차는 사라졌습니다.
     여기가 UI 를 늘리는 것이 아닌 이유: **게임이 멈춰 있을 때만** 뜹니다.
     「손이 곧 상태창」(PLAN §5-2)은 *노는 동안* 화면에 얹지 말라는 규칙이지,
     멈춘 화면까지 비우라는 뜻이 아닙니다. 오히려 여기서 「어디까지 왔나」를
     안 말하면 2시간짜리에서 사람은 자기가 어디쯤인지 영영 모릅니다. -->
<div id="pause" hidden>
  <b>멈췄습니다</b>
  <p class="where"></p>
  <p class="note"></p>
  <p class="key">화면을 누르면 계속합니다 &middot; <b>Esc</b></p>
  <!-- 멈춤 화면에도 같은 단추 둘. 노는 중에 F2 가 안 먹는 자판이면
       **Esc 는 반드시 먹으므로** 이것이 막히지 않는 길이 됩니다 -->
  <div class="btns" data-ui>
    <button id="btn-new2" type="button">처음부터 다시</button>
    <button id="btn-check2" type="button">점검 모드</button>
  </div>
</div>

<!-- ★ 게임 오버. **이 게임의 유일한 끝**입니다 — 수동 조작 중 행성 충돌.
     자동 항법을 켜 두면 절대 안 옵니다. 그래서 죽음은 **고른 사람에게만**
     오고, 그래서 억울하지 않습니다. (docs/space/PLAN2H.md §9 의 앞자락) -->
<div id="over" hidden>
  <b>배가 부서졌습니다</b>
  <p class="where"></p>
  <p class="note"></p>
  <p class="key">자동 항법을 켜 두면 행성에 안 끌려갑니다 &middot; <b>새로고침</b>으로 다시 시작합니다</p>
</div>

<!-- ★★ 끝 — 「이렇게 왔다」 (PLAN2H §9 · 8판).
     **점수가 아니라 목록**입니다. 등급도 총점도 없습니다 — 붙이는 순간
     이 게임은 「잘한 판」과 「못한 판」이 있는 게임이 되고, 그러면 사람은
     다음에 아끼려 들고, 아끼면 「가는 동안 먹고, 고치고, 뿌리친다」를
     안 하게 됩니다. 목적 한 줄이 「적진을 뚫고 들어간다」이므로
     **도착이 전부**이고, 목록은 어떻게 왔는지만 말합니다.
     ★ v69 — 옛 한 줄은 「따라오지 못하는 곳까지 간다」였습니다.
       사장님이 목적을 뒤집으셨습니다 (`docs/space/WAR.md`).
     줄의 정의는 `game/ending-table.js` 한 곳에 있습니다. -->
<div id="end" hidden data-ui>
  <b></b>
  <p class="where"></p>
  <div class="list"></div>
  <p class="again"></p>
  <div class="btns">
    <button id="btn-new3" type="button">새 배로 시작</button>
  </div>
</div>

<script type="module" src="js/main.js?v=78"></script>
</body>
</html>
