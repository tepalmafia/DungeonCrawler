<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>리니지 초창기 화풍 시제품 — 심연의 왕관</title>
<style>
  html, body { margin: 0; background: #0a0906; color: #e8e2d6;
    font-family: 'Galmuri11', system-ui, sans-serif; overflow: hidden; }
  @font-face { font-family: 'Galmuri11'; src: url('../fonts/Galmuri11.woff2') format('woff2'); font-display: swap; }
  #view { display: block; width: 100vw; height: 100vh; }
  #labels { position: fixed; inset: 0; pointer-events: none; }
  .row { position: absolute; left: 0; right: 0; }
  .row b { position: absolute; left: 16px; top: 10px; font-size: 18px; letter-spacing: 1px;
    color: #ffd9a8; text-shadow: 0 2px 6px #000; }
  .row i { position: absolute; left: 16px; top: 34px; font-size: 12px; font-style: normal;
    color: #a2988a; text-shadow: 0 2px 4px #000; }
  .name { position: absolute; text-align: center; transform: translateX(-50%);
    font-size: 13px; color: #e6dcc4; text-shadow: 0 2px 5px #000; }
  .name s { display: block; text-decoration: none; font-size: 11px; color: #8d8474; margin-top: 2px; }
  .hr { position: absolute; left: 0; right: 0; height: 1px; background: rgba(255,255,255,.12); }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.min.js" } }
</script>
</head>
<body>
<canvas id="view"></canvas>
<div id="labels"></div>
<script type="module">
import * as THREE from 'three';
import { CAST, toon, lineageFloorTexture, lineageWallTexture, lineageWallTopTexture } from './js/proto/lineage.js';
import { buildKnight } from './js/game/player.js';
import { ARCHETYPES } from './js/game/enemies.js';
import './js/game/boss.js';                        // ARCHETYPES.lord 등록
import { floorTexture, wallTexture, wallTopTexture, floorHeight, wallHeight, floorRough } from './js/core/textures.js';
import { normalTexture, dataTexture } from './js/core/normalmap.js';
import { themeFor } from './js/world/dungeon.js';

const params = new URLSearchParams(location.search);
const VIEW = params.get('view') || 'cast';
const theme = themeFor(1);

const canvas = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.setScissorTest(true);

// ── 배우 명단 ──────────────────────────────────────────────
// 대조군은 실제 게임 빌더를 그대로 부른다. 대조군이 거짓이면 비교가 무의미하다.
const CURRENT = [
  { key: 'knight', label: '기사', sub: '플레이어', build: () => buildKnight().group },
  { key: 'skeleton', label: '해골 병사', sub: '', build: () => ARCHETYPES.skeleton.build().group },
  { key: 'ghoul', label: '구울', sub: '', build: () => ARCHETYPES.ghoul.build().group },
  { key: 'archer', label: '망령 궁수', sub: '', build: () => ARCHETYPES.archer.build().group },
  { key: 'golem', label: '무덤 골렘', sub: '', build: () => ARCHETYPES.golem.build().group },
  { key: 'lord', label: '심연의 군주', sub: '보스', build: () => ARCHETYPES.lord.build().group },
];

const GAP = 2.3;

// 두 줄의 조명·배경·카메라는 **완전히 같다**. 다른 건 오직 메시와 재질이다 —
// 대조군을 어둡게 깔면 비교가 아니라 연출이 된다.
function castScene(list) {
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x1e1a15);

  // 무대 바닥 — 발밑이 없으면 떠 보인다. 화면 밖까지 넉넉히.
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(400, 200),
    new THREE.MeshLambertMaterial({ color: 0x3a3228 }));
  floor.rotation.x = -Math.PI / 2;
  floor.receiveShadow = true;
  scene.add(floor);

  const spots = [];
  list.forEach((c, i) => {
    const g = c.build();
    const x = (i - (list.length - 1) / 2) * GAP;
    g.position.set(x, 0, 0);
    g.rotation.y = 0.42;                      // 정면보다 살짝 틀어야 두께가 보인다
    g.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
    scene.add(g);
    spots.push(new THREE.Vector3(x, 0, 0));
  });

  scene.add(new THREE.HemisphereLight(0x4a4436, 0x1a1610, 1.35));
  const key = new THREE.DirectionalLight(0xfff2da, 1.75);
  key.position.set(5, 11, 9);
  key.castShadow = true;
  key.shadow.mapSize.set(2048, 1024);
  const sc = key.shadow.camera;
  sc.left = -10; sc.right = 10; sc.top = 6; sc.bottom = -3; sc.near = 1; sc.far = 40;
  sc.updateProjectionMatrix();
  key.shadow.bias = -0.0015;
  key.shadow.normalBias = 0.03;
  scene.add(key, key.target);
  const fill = new THREE.DirectionalLight(0xa8b8d8, 0.55);
  fill.position.set(-7, 3, 5);
  scene.add(fill);

  const camera = new THREE.PerspectiveCamera(30, 3, 0.5, 200);
  camera.position.set(0, 2.7, 9.9);
  camera.lookAt(0, 1.35, 0);
  return { scene, camera, exposure: 1.0, spots };
}

// ── 장면(지도) — 구조는 같고 색·질감만 다르다 ─────────────────
const CELL = 2, WALL_H = 3.4;
function wallSlots() {
  const out = [];
  for (let i = 0; i < 8; i++) out.push({ x: (i - 3.5) * CELL, z: -7 });
  for (let i = 0; i < 5; i++) out.push({ x: -8, z: (i - 3) * CELL });
  return out;
}

// 두 패널의 기하·배치·카메라는 같다. 재질과 조명만 다르다.
// 대조군은 게임이 실제로 쓰는 파이프라인(Standard + 노멀·거칠기맵)과
// 실제 조명값(앰비언트 0.26 / 달 0.34 / 등불 반경 9)을 그대로 쓴다.
const SPOTS = [
  { slot: 0, x: 0.5, z: 0.5, r: 2.6 },      // 기사
  { slot: 1, x: 3.6, z: -1.6, r: -2.2 },    // 해골
  { slot: 3, x: -3.4, z: -0.6, r: -1.2 },   // 궁수
];
const TORCHES = [{ x: -1, z: -7 }, { x: 5, z: -7 }];

function mapScene(kind) {
  const L = kind === 'lineage';
  const scene = new THREE.Scene();
  const fogCol = L ? 0x1f1a12 : theme.fog;
  scene.background = new THREE.Color(fogCol);
  scene.fog = new THREE.FogExp2(fogCol, 0.03);

  const rep = 2.7;
  let floorMat, sideMat, topMat;
  if (L) {
    floorMat = toon(0xffffff, { map: lineageFloorTexture(rep) });
    sideMat = toon(0xffffff, { map: lineageWallTexture(1) });
    topMat = toon(0xffffff, { map: lineageWallTopTexture(1) });
  } else {
    const ft = floorTexture(theme, 1); ft.repeat.set(rep, rep);
    floorMat = new THREE.MeshStandardMaterial({
      map: ft, color: 0x6a6472, roughness: 1, metalness: 0.06,
      normalMap: normalTexture(floorHeight(theme), { repeat: rep, strength: 2.6 }),
      roughnessMap: dataTexture(floorRough(theme), { repeat: rep }),
    });
    floorMat.normalScale.set(1.1, 1.1);
    sideMat = new THREE.MeshStandardMaterial({
      map: wallTexture(theme), color: 0x5e586a, roughness: 1, metalness: 0.04,
      normalMap: normalTexture(wallHeight(theme), { repeat: 1, strength: 3.0 }),
    });
    sideMat.normalScale.set(1.4, 1.4);
    topMat = new THREE.MeshStandardMaterial({ map: wallTopTexture(theme), color: 0x5e586a, roughness: 1 });
  }

  const floor = new THREE.Mesh(new THREE.PlaneGeometry(16, 16), floorMat);
  floor.rotation.x = -Math.PI / 2;
  floor.receiveShadow = true;
  scene.add(floor);

  const geo = new THREE.BoxGeometry(CELL, WALL_H, CELL);
  for (const s of wallSlots()) {
    const m = new THREE.Mesh(geo, [sideMat, sideMat, topMat, sideMat, sideMat, sideMat]);
    m.position.set(s.x, WALL_H / 2, s.z);
    m.castShadow = m.receiveShadow = true;
    scene.add(m);
  }

  const cast = L ? CAST : CURRENT;
  for (const p of SPOTS) {
    const obj = cast[p.slot].build();
    obj.position.set(p.x, 0, p.z);
    obj.rotation.y = p.r;
    obj.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
    scene.add(obj);
  }

  // 리니지풍은 「읽히는 밝기」가 전제다 — 다만 게임의 랜턴 설계와 정면으로 부딪힌다.
  // 그 충돌을 숨기지 않으려고 두 값을 그대로 나란히 둔다.
  scene.add(new THREE.HemisphereLight(L ? 0x3a3226 : 0x272038, L ? 0x14100a : 0x08060d, L ? 0.42 : 0.26));
  const moon = new THREE.DirectionalLight(L ? 0xffeed2 : 0x8296c8, L ? 0.5 : 0.34);
  moon.position.set(6, 14, 8);
  moon.castShadow = true;
  moon.shadow.mapSize.set(1024, 1024);
  const sc = moon.shadow.camera;
  sc.left = -12; sc.right = 12; sc.top = 12; sc.bottom = -12; sc.near = 1; sc.far = 40;
  sc.updateProjectionMatrix();
  moon.shadow.bias = -0.0016;
  moon.shadow.normalBias = 0.035;
  scene.add(moon, moon.target);
  for (const t of TORCHES) {
    const l = new THREE.PointLight(L ? 0xffb45a : theme.torch, L ? 30 : 78, 18, 2);
    l.position.set(t.x, 2.2, t.z + 1.15);
    scene.add(l);
  }
  const lamp = new THREE.PointLight(L ? 0xffc98a : 0xffb257, L ? 26 : 34, L ? 11 : 9, 2);
  lamp.position.set(SPOTS[0].x, 1.9, SPOTS[0].z);
  scene.add(lamp);

  const camera = new THREE.PerspectiveCamera(34, 1, 0.5, 200);
  const pitch = 54 * Math.PI / 180, dist = 17;
  const look = new THREE.Vector3(0.5, 1.1, -2.7);
  camera.position.set(look.x, look.y + Math.sin(pitch) * dist, look.z + Math.cos(pitch) * dist);
  camera.lookAt(look);
  return { scene, camera, exposure: L ? 0.92 : 1.0 };
}

// ── 패널 구성 ──────────────────────────────────────────────
let PANELS, GRID;
if (VIEW === 'scene') {
  GRID = { rows: 1, cols: 2 };
  PANELS = [
    { ...mapScene('current'), title: '현재', note: '차가운 회보라 · 노멀맵 요철 · 실제 게임 조명값(앰비언트 0.26)' },
    { ...mapScene('lineage'), title: '리니지풍', note: '격자 없는 유기적 흙바닥 · 무채색 환경 · 채도는 캐릭터에만' },
  ];
} else {
  GRID = { rows: 2, cols: 1 };
  PANELS = [
    { ...castScene(CAST), title: '리니지풍 (새로 지음)',
      note: '참고 이미지 반영 — 날씬한 6.5등신 · 부드러운 칠 음영 · 은백+진홍 두 색으로 읽힌다', names: CAST },
    { ...castScene(CURRENT), title: '현재 (대조군 — 실제 게임 빌더 · 조명 동일)',
      note: '사실적 비율 · 상자 조합 · 반사 재질', names: CURRENT },
  ];
}

// ── 라벨 ──────────────────────────────────────────────────
const labels = document.getElementById('labels');
function layoutLabels() {
  labels.innerHTML = '';
  const pw = innerWidth / GRID.cols, ph = innerHeight / GRID.rows;
  PANELS.forEach((p, i) => {
    const r = Math.floor(i / GRID.cols), c = i % GRID.cols;
    const d = document.createElement('div');
    d.className = 'row';
    d.style.left = `${c * pw}px`; d.style.width = `${pw}px`;
    d.style.top = `${r * ph}px`; d.style.height = `${ph}px`;
    d.innerHTML = `<b>${p.title}</b><i>${p.note}</i>`;
    if (p.names && p.spots) {
      // 라벨 위치는 실제 3D 좌표를 투영해서 찍는다 — 눈대중으로 나누면 어긋난다
      p.camera.updateMatrixWorld();
      p.names.forEach((n, j) => {
        const v = p.spots[j].clone().project(p.camera);
        const x = (v.x * 0.5 + 0.5) * pw;
        d.innerHTML += `<div class="name" style="left:${x}px;top:${ph - 46}px">`
          + `${n.label}${n.sub ? `<s>${n.sub}</s>` : ''}</div>`;
      });
    }
    labels.appendChild(d);
    if (i) {
      const hr = document.createElement('div');
      hr.className = 'hr';
      hr.style.top = `${r * ph}px`;
      labels.appendChild(hr);
    }
  });
}

function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  const pw = innerWidth / GRID.cols, ph = innerHeight / GRID.rows;
  for (const p of PANELS) { p.camera.aspect = pw / ph; p.camera.updateProjectionMatrix(); }
  layoutLabels();
}
addEventListener('resize', resize);
resize();

let t = 0;
function frame() {
  requestAnimationFrame(frame);
  t += 1 / 60;
  const pw = innerWidth / GRID.cols, ph = innerHeight / GRID.rows;
  PANELS.forEach((p, i) => {
    const r = Math.floor(i / GRID.cols), c = i % GRID.cols;
    const y = innerHeight - (r + 1) * ph;         // WebGL 은 아래가 원점
    renderer.setViewport(c * pw, y, pw, ph);
    renderer.setScissor(c * pw, y, pw, ph);
    renderer.toneMappingExposure = p.exposure;
    renderer.render(p.scene, p.camera);
  });
  window.PROTO_READY = t > 0.5;
}
requestAnimationFrame(frame);

window.LPROTO = { PANELS, VIEW };
</script>
</body>
</html>
