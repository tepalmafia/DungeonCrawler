<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>아트 방향 시제품 비교 — 심연의 왕관</title>
<style>
  html, body { margin: 0; background: #06050a; color: #e8e2d6;
    font-family: 'Galmuri11', system-ui, sans-serif; overflow: hidden; }
  @font-face { font-family: 'Galmuri11'; src: url('../fonts/Galmuri11.woff2') format('woff2'); font-display: swap; }
  #view { display: block; width: 100vw; height: 100vh; }
  #labels { position: fixed; inset: 0; display: flex; pointer-events: none; }
  .lab { flex: 1; padding: 14px 18px; }
  .lab b { display: block; font-size: 19px; letter-spacing: 1px; color: #ffd9a8; text-shadow: 0 2px 6px #000; }
  .lab span { display: block; font-size: 13px; color: #a99f90; margin-top: 4px; text-shadow: 0 2px 4px #000; }
  .lab i { display: block; font-size: 12px; color: #7f7768; margin-top: 10px; font-style: normal; line-height: 1.7; }
  .sep { position: fixed; top: 0; bottom: 0; width: 1px; background: rgba(255,255,255,.13); }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.min.js" } }
</script>
</head>
<body>
<canvas id="view"></canvas>
<div id="labels"></div>
<script type="module">
import * as THREE from 'three';
import { STYLES, buildPanel } from './js/proto/styles.js';

const NOTES = {
  current: ['축 정렬 정육면체를 격자에 세운다', '모든 벽 높이가 같다', '표면은 색만 있고 요철이 없다'],
  A: ['모따기·테이퍼로 각을 없앤다', '벽 높이가 제각각 + 밑에 바위', '채도를 올리고 밝게 — 읽기 쉬움'],
  B: ['노멀맵으로 벽돌이 실제로 파인다', '거칠기맵 — 젖은 바닥이 횃불을 반사', '어둡고 대비가 강하다'],
};

const canvas = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.setScissorTest(true);

const panels = STYLES.map((s) => ({ ...s, ...buildPanel(s.key) }));

const labels = document.getElementById('labels');
labels.innerHTML = panels.map((p) =>
  `<div class="lab"><b>${p.label}</b><span>${p.note}</span>`
  + `<i>${NOTES[p.key].map((n) => '· ' + n).join('<br>')}</i></div>`).join('');
for (let i = 1; i < panels.length; i++) {
  const d = document.createElement('div');
  d.className = 'sep';
  d.style.left = `${(i / panels.length) * 100}%`;
  labels.appendChild(d);
}

function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  const w = innerWidth / panels.length;
  for (const p of panels) { p.camera.aspect = w / innerHeight; p.camera.updateProjectionMatrix(); }
}
addEventListener('resize', resize);
resize();

let t = 0;
function frame() {
  requestAnimationFrame(frame);
  t += 1 / 60;
  const w = innerWidth / panels.length;
  panels.forEach((p, i) => {
    renderer.setViewport(i * w, 0, w, innerHeight);
    renderer.setScissor(i * w, 0, w, innerHeight);
    renderer.toneMappingExposure = p.exposure;
    renderer.render(p.scene, p.camera);
  });
  window.PROTO_READY = t > 0.5;
}
requestAnimationFrame(frame);

window.PROTO = { panels, STYLES };
</script>
</body>
</html>
