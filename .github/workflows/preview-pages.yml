# 브랜치 미리보기 — 머지하지 않고 확인하기 위한 배포.
#
# Pages 는 사이트 하나만 서빙하므로, 사이트를 「조립」해서 올린다:
#   /            ← main 의 web/      (지금 라이브가 그대로 유지된다)
#   /preview/    ← 이 브랜치의 web/  (확인할 것)
# 두 탭에 띄워놓고 비교할 수 있고, main 에는 커밋이 하나도 안 들어간다.
#
# 주의: github-pages 환경이 기본 브랜치만 배포하도록 잠겨 있으면 이 실행은
# 실패한다. 그래도 라이브는 무사하다 — Pages 는 마지막 성공한 배포를 계속
# 서빙하기 때문이다. 다음에 main 으로 머지되면 /preview/ 는 자연히 사라진다.

name: Preview branch on GitHub Pages

on:
  push:
    branches:
      - 'claude/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# main 배포와 같은 그룹 — 둘이 겹쳐 서로를 덮어쓰지 않게 한다
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          path: branch

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: base

      - name: Assemble site (main at root, branch under /preview)
        # 브랜치 이름을 셸에 직접 박지 않는다 — 환경변수로 넘긴다
        env:
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          mkdir -p _site/preview
          cp -r base/web/. _site/
          cp -r branch/web/. _site/preview/
          # 어느 탭이 미리보기인지 눈으로 구분되어야 한다
          {
            printf '<div style="position:fixed;top:0;left:0;z-index:9999;'
            printf 'padding:4px 10px;font:600 12px/1.4 system-ui,sans-serif;'
            printf 'color:#ffd88a;background:rgba(40,20,10,.85);'
            printf 'border-bottom-right-radius:6px;pointer-events:none">'
            printf '미리보기 — %s (%s)' "$REF" "$(echo "$SHA" | cut -c1-7)"
            printf '</div>\n'
          } >> _site/preview/3d/index.html
          echo "── 배포될 트리 ──"
          ls _site _site/preview

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload assembled site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
